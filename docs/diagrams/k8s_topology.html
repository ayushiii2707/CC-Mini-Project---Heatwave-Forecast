<rect x="896" y="314" width="126" height="78" rx="6" class="ai"/><text x="959" y="338" text-anchor="middle" class="h">api pod</text><text x="959" y="356" text-anchor="middle" class="s">FastAPI :8000</text><text x="959" y="374" text-anchor="middle" class="s">7 models in memory</text>

<!-- strategy box -->
<rect x="1080" y="160" width="260" height="298" rx="8" class="box"/>
<text x="1210" y="186" text-anchor="middle" class="h">Operations shown</text>
<text x="1096" y="214" class="b">• kubectl apply (declarative)</text>
<text x="1096" y="238" class="b">• scale web 2 → 4, api 2 → 3</text>
<text x="1096" y="262" class="b">• delete pod → recreated</text>
<text x="1096" y="286" class="b">• bad tag → ImagePullBackOff,</text>
<text x="1110" y="304" class="b">old pods keep serving</text>
<text x="1096" y="328" class="b">• kubectl rollout undo</text>
<text x="1096" y="352" class="b">• rolling update, strategy:</text>
<text x="1110" y="370" class="b">maxSurge 1, maxUnavailable 0,</text>
<text x="1110" y="388" class="b">preStop sleep 5 s</text>
<text x="1096" y="416" class="h">0 failed requests in</text>
<text x="1096" y="436" class="h">89 · 114 · 248 checks</text>
<rect x="350" y="490" width="990" height="170" rx="8" fill="#ffffff" stroke="#bbb"/>
<text x="368" y="516" class="h">Why each object exists (in HeatGuard terms)</text>
<text x="368" y="542" class="b">Deployment: keeps the requested number of forecast servers running and replaces any that fail.</text>
<text x="368" y="564" class="b">ReplicaSet: one per version; old ones are kept at 0 replicas so a bad release can be rolled back instantly.</text>
<text x="368" y="586" class="b">Service (ClusterIP): one stable internal name for all backend pods, with load balancing; the backend is never exposed directly.</text>
<text x="368" y="608" class="b">Service (NodePort): the single public entry point; the frontend proxies /api/ to the backend Service.</text>
<text x="368" y="630" class="b">Probes: a pod gets traffic only after its 7 models are loaded (readiness) and is restarted if it hangs (liveness).</text>
<text x="368" y="652" class="b">preStop + maxUnavailable 0: a pod leaves the Service before it stops, so updates do not drop warnings.</text>
