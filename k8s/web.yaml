# Experiment 3: HeatGuard web frontend (nginx). Serves the app and proxies /api/ to the backend.
# Exposed outside the cluster on NodePort 30080 (mapped to localhost:30080 by kind-config.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heatguard-web
  labels: {app: heatguard-web, tier: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: heatguard-web}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: heatguard-web, tier: frontend}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: docker.io/DOCKERHUB_USER/heatguard-web:2.0
          imagePullPolicy: Always
          env:
            - name: API_URL
              value: http://heatguard-api:8000   # Kubernetes DNS name of the backend Service
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: heatguard-web
spec:
  type: NodePort
  selector: {app: heatguard-web}
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
