<!doctype html>
<html><head><meta charset="utf-8"><title>HeatGuard architecture</title>
<style>body{margin:0;background:#fff;font-family:system-ui,-apple-system,sans-serif}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <text x="700" y="34" text-anchor="middle" font-size="24" font-weight="700">HeatGuard v2: system architecture and data flow</text>
  <text x="700" y="58" text-anchor="middle" font-size="14" fill="#555">Use case KJS-CES-01 · AI component (orange) · Cloud Computing experiments (blue) · Data (green)</text>

  <!-- Offline pipeline -->
  <rect x="30" y="80" width="1340" height="140" rx="10" fill="#f1f8f1" stroke="#2e7d32"/>
  <text x="45" y="103" font-size="15" font-weight="700" fill="#2e7d32">Offline: data and model training (Python)</text>
  <g font-size="13">
    <rect x="50" y="115" width="215" height="90" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="157" y="140" text-anchor="middle" font-weight="700">IMD Pune gridded Tmax</text>
    <text x="157" y="160" text-anchor="middle">1°×1° .GRD, 2014–2024</text>
    <text x="157" y="178" text-anchor="middle">download_imd.sh (retries)</text>
    <rect x="315" y="115" width="215" height="90" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="422" y="140" text-anchor="middle" font-weight="700">prepare_data.py</text>
    <text x="422" y="160" text-anchor="middle">10 city grid cells</text>
    <text x="422" y="178" text-anchor="middle">city_tmax.csv (40,180 rows)</text>
    <rect x="580" y="115" width="330" height="90" rx="8" fill="#fff4ec" stroke="#b4441c" stroke-width="2"/>
    <text x="745" y="140" text-anchor="middle" font-weight="700">train.py (AI: machine learning)</text>
    <text x="745" y="160" text-anchor="middle">7 models, one per forecast day (h = 1..7)</text>
    <text x="745" y="178" text-anchor="middle">ridge vs GBM vs persistence vs climatology</text>
    <text x="745" y="196" text-anchor="middle">per-day alert margin + confidence (2023)</text>
    <rect x="960" y="115" width="180" height="90" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="1050" y="145" text-anchor="middle" font-weight="700">models/</text>
    <text x="1050" y="165" text-anchor="middle">model.joblib (7 models)</text>
    <text x="1050" y="183" text-anchor="middle">metrics.json</text>
    <rect x="1190" y="115" width="160" height="90" rx="8" fill="#fff" stroke="#555"/>
    <text x="1270" y="145" text-anchor="middle" font-weight="700">pytest</text>
    <text x="1270" y="165" text-anchor="middle">18 tests incl.</text>
    <text x="1270" y="183" text-anchor="middle">invalid inputs</text>
  </g>
  <g stroke="#333" stroke-width="1.6" marker-end="url(#a)">
    <line x1="265" y1="160" x2="313" y2="160"/><line x1="530" y1="160" x2="578" y2="160"/>
    <line x1="910" y1="160" x2="958" y2="160"/><line x1="1140" y1="160" x2="1188" y2="160"/>
  </g>

  <!-- Exp 2: two images -->
  <rect x="30" y="250" width="860" height="300" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="45" y="275" font-size="15" font-weight="700" fill="#1f5fa8">Experiment 2: two Docker images (arm64 + amd64), run together with Docker Compose</text>
  <g font-size="13">
    <rect x="55" y="290" width="300" height="240" rx="8" fill="#fff" stroke="#1f5fa8"/>
    <text x="205" y="313" text-anchor="middle" font-weight="700">Frontend: heatguard-web:2.0</text>
    <text x="205" y="333" text-anchor="middle">nginx (unprivileged) :8080</text>
    <rect x="75" y="345" width="260" height="95" rx="6" fill="#f7f7f7" stroke="#999"/>
    <text x="205" y="366" text-anchor="middle" font-weight="700">Web app (HTML/CSS/JS)</text>
    <text x="205" y="385" text-anchor="middle">alert banner · 7-day cards</text>
    <text x="205" y="403" text-anchor="middle">trend chart · India map · ranking</text>
    <text x="205" y="421" text-anchor="middle">what-if form · reliability panel</text>
    <rect x="75" y="455" width="260" height="58" rx="6" fill="#f7f7f7" stroke="#999"/>
    <text x="205" y="478" text-anchor="middle" font-weight="700">Reverse proxy /api/ → API_URL</text>
    <text x="205" y="497" text-anchor="middle">/healthz for probes</text>

    <rect x="430" y="290" width="440" height="240" rx="8" fill="#fff" stroke="#1f5fa8"/>
    <text x="650" y="313" text-anchor="middle" font-weight="700">Backend: heatguard:2.0 (FastAPI + Uvicorn :8000)</text>
    <rect x="450" y="330" width="125" height="64" rx="6" fill="#f7f7f7" stroke="#999"/>
    <text x="512" y="356" text-anchor="middle" font-weight="700">Validation</text>
    <text x="512" y="375" text-anchor="middle">404 / 422</text>
    <rect x="590" y="330" width="135" height="64" rx="6" fill="#fff4ec" stroke="#b4441c" stroke-width="2"/>
    <text x="657" y="356" text-anchor="middle" font-weight="700">7 ML models</text>
    <text x="657" y="375" text-anchor="middle">Tmax day 1..7</text>
    <rect x="740" y="330" width="115" height="64" rx="6" fill="#fff4ec" stroke="#b4441c" stroke-dasharray="5 3"/>
    <text x="797" y="356" text-anchor="middle" font-weight="700">IMD rules</text>
    <text x="797" y="375" text-anchor="middle">+ margin, conf.</text>
    <text x="450" y="425">GET /health · /cities · /observed · /outlook · /model-info</text>
    <text x="450" y="445">POST /predict → 7-day forecast, alerts, advisory</text>
    <text x="450" y="470">Bundled: models, metrics, IMD city series · non-root</text>
    <text x="450" y="490">Swagger docs at /docs · HEALTHCHECK on /health</text>
    <text x="450" y="512" fill="#555">Exp 2 manual tasks: nginx, hello-world, ubuntu (v1 log)</text>
  </g>
  <g stroke="#333" stroke-width="1.6" marker-end="url(#a)">
    <line x1="575" y1="362" x2="588" y2="362"/><line x1="725" y1="362" x2="738" y2="362"/>
    <line x1="335" y1="484" x2="428" y2="420"/>
  </g>
  <text x="362" y="500" font-size="12">/api/* (HTTP)</text>
  <path d="M1050 205 L1050 235 L650 235 L650 288" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="830" y="230" font-size="12">COPY into backend image</text>

  <!-- Docker Hub -->
  <rect x="950" y="250" width="400" height="95" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="1150" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">Docker Hub (registry)</text>
  <text x="1150" y="303" text-anchor="middle" font-size="13">ayushiranjan27/heatguard:2.0</text>
  <text x="1150" y="322" text-anchor="middle" font-size="13">ayushiranjan27/heatguard-web:2.0 · buildx multi-arch</text>
  <line x1="890" y1="300" x2="948" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="893" y="292" font-size="12">push</text>

  <!-- Exp 3 -->
  <rect x="950" y="375" width="400" height="390" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="965" y="400" font-size="15" font-weight="700" fill="#1f5fa8">Experiment 3: Kubernetes (kind cluster)</text>
  <g font-size="13">
    <rect x="975" y="415" width="350" height="48" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="1150" y="436" text-anchor="middle" font-weight="700">Service heatguard-web: NodePort 30080</text>
    <text x="1150" y="454" text-anchor="middle">public entry point</text>
    <rect x="975" y="475" width="350" height="78" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="1150" y="495" text-anchor="middle" font-weight="700">Deployment heatguard-web (2 → 4)</text>
    <rect x="995" y="505" width="70" height="36" rx="5" fill="#eef4fb" stroke="#1f5fa8"/><text x="1030" y="528" text-anchor="middle">web</text>
    <rect x="1075" y="505" width="70" height="36" rx="5" fill="#eef4fb" stroke="#1f5fa8"/><text x="1110" y="528" text-anchor="middle">web</text>
    <rect x="1155" y="505" width="70" height="36" rx="5" fill="#eef4fb" stroke="#1f5fa8" stroke-dasharray="4 3"/><text x="1190" y="528" text-anchor="middle">web</text>
    <rect x="1235" y="505" width="70" height="36" rx="5" fill="#eef4fb" stroke="#1f5fa8" stroke-dasharray="4 3"/><text x="1270" y="528" text-anchor="middle">web</text>
    <rect x="975" y="572" width="350" height="44" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="1150" y="591" text-anchor="middle" font-weight="700">Service heatguard-api: ClusterIP :8000</text>
    <text x="1150" y="608" text-anchor="middle">internal only (DNS name heatguard-api)</text>
    <rect x="975" y="628" width="350" height="78" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="1150" y="648" text-anchor="middle" font-weight="700">Deployment heatguard-api (2 → 3)</text>
    <rect x="1020" y="658" width="80" height="36" rx="5" fill="#fff4ec" stroke="#b4441c"/><text x="1060" y="681" text-anchor="middle">api</text>
    <rect x="1110" y="658" width="80" height="36" rx="5" fill="#fff4ec" stroke="#b4441c"/><text x="1150" y="681" text-anchor="middle">api</text>
    <rect x="1200" y="658" width="80" height="36" rx="5" fill="#fff4ec" stroke="#b4441c" stroke-dasharray="4 3"/><text x="1240" y="681" text-anchor="middle">api</text>
    <text x="1150" y="728" text-anchor="middle">maxSurge 1 · maxUnavailable 0 · preStop 5 s · probes</text>
    <text x="1150" y="748" text-anchor="middle">self-healing · rollback · api limits from Exp 7</text>
  </g>
  <g stroke="#333" stroke-width="1.6" marker-end="url(#a)">
    <line x1="1150" y1="463" x2="1150" y2="473"/><line x1="1150" y1="553" x2="1150" y2="570"/><line x1="1150" y1="616" x2="1150" y2="626"/>
  </g>
  <line x1="1340" y1="345" x2="1340" y2="500" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="1270" y="370" font-size="12">docker pull</text>

  <!-- user -->
  <rect x="955" y="800" width="390" height="64" rx="10" fill="#fff" stroke="#555"/>
  <text x="1150" y="826" text-anchor="middle" font-size="14" font-weight="700">User: web browser</text>
  <text x="1150" y="846" text-anchor="middle" font-size="13">localhost:30080 (Kubernetes) or :8080 (Compose)</text>
  <line x1="1150" y1="798" x2="1150" y2="767" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Exp 7/8 -->
  <rect x="30" y="580" width="860" height="285" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="45" y="605" font-size="15" font-weight="700" fill="#1f5fa8">Experiments 7 and 8: measurement and cost optimisation of the backend (same image, same workload)</text>
  <g font-size="13">
    <rect x="55" y="620" width="220" height="110" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="165" y="645" text-anchor="middle" font-weight="700">loadtest.py</text>
    <text x="165" y="667" text-anchor="middle">15,000 POST /predict</text>
    <text x="165" y="687" text-anchor="middle">(7-day forecasts)</text>
    <text x="165" y="707" text-anchor="middle">20 clients, fixed seed</text>
    <rect x="320" y="620" width="250" height="110" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="445" y="645" text-anchor="middle" font-weight="700">docker run --cpus --memory</text>
    <text x="445" y="667" text-anchor="middle">Exp 7: 2 vCPU/2 GB → right-sized</text>
    <text x="445" y="687" text-anchor="middle">Exp 8: 0.25 / 0.5 / 1 vCPU</text>
    <text x="445" y="707" text-anchor="middle">3 repeats each</text>
    <rect x="615" y="620" width="250" height="110" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="740" y="645" text-anchor="middle" font-weight="700">docker stats + latency</text>
    <text x="740" y="667" text-anchor="middle">CPU, memory, req/s, p50/p95</text>
    <text x="740" y="687" text-anchor="middle">cost estimate: AWS Fargate ARM</text>
    <text x="740" y="707" text-anchor="middle">Mumbai price list (2026-09-11)</text>
    <text x="55" y="765">Exp 7: limits = measured peak × buffer → reused as backend limits in the Kubernetes Deployment.</text>
    <text x="55" y="788">Exp 8: target fixed in advance (throughput and p95 latency); cheapest size that meets it is chosen.</text>
    <text x="55" y="811" fill="#555">Costs are estimates (no cloud account used); instance sizes are emulated with Docker limits on an Apple M2.</text>
  </g>
  <g stroke="#333" stroke-width="1.6" marker-end="url(#a)">
    <line x1="275" y1="675" x2="318" y2="675"/><line x1="570" y1="675" x2="613" y2="675"/>
  </g>
  <path d="M650 550 L650 578" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text x="658" y="570" font-size="12">backend image</text>
  <path d="M890 760 L925 760 L925 690 L1018 690" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text x="896" y="778" font-size="12">right-sized limits</text>
</svg>
</body></html>
