<!doctype html>
<html><head><meta charset="utf-8"><title>HeatGuard architecture</title>
<style>body{margin:0;background:#fff;font-family:system-ui,-apple-system,sans-serif}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <text x="700" y="36" text-anchor="middle" font-size="24" font-weight="700">HeatGuard: system architecture and data flow</text>
  <text x="700" y="60" text-anchor="middle" font-size="14" fill="#555">Use case KJS-CES-01 · AI component (orange) · Cloud Computing experiments (blue) · Data (green)</text>

  <!-- Data pipeline -->
  <rect x="30" y="100" width="1340" height="150" rx="10" fill="#f1f8f1" stroke="#2e7d32"/>
  <text x="45" y="124" font-size="15" font-weight="700" fill="#2e7d32">Offline: data and model training (Python, run on the laptop)</text>
  <g font-size="13">
    <rect x="50" y="140" width="210" height="90" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="155" y="165" text-anchor="middle" font-weight="700">IMD Pune gridded Tmax</text>
    <text x="155" y="185" text-anchor="middle">1°×1° binary .GRD, 2014–2024</text>
    <text x="155" y="203" text-anchor="middle">download_imd.sh (retries)</text>
    <rect x="320" y="140" width="210" height="90" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="425" y="165" text-anchor="middle" font-weight="700">prepare_data.py</text>
    <text x="425" y="185" text-anchor="middle">parse 31×31 grid, 10 city cells</text>
    <text x="425" y="203" text-anchor="middle">→ city_tmax.csv (40,180 rows)</text>
    <rect x="590" y="140" width="300" height="90" rx="8" fill="#fff4ec" stroke="#b4441c" stroke-width="2"/>
    <text x="740" y="165" text-anchor="middle" font-weight="700">train.py (AI: machine learning)</text>
    <text x="740" y="185" text-anchor="middle">features: 7 lags, mean, season, normal, lat/lon</text>
    <text x="740" y="203" text-anchor="middle">Ridge vs GBM vs persistence; split 2014-22/23/24</text>
    <text x="740" y="221" text-anchor="middle">alert margin 1.25 °C chosen on 2023</text>
    <rect x="950" y="140" width="190" height="90" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="1045" y="170" text-anchor="middle" font-weight="700">models/</text>
    <text x="1045" y="190" text-anchor="middle">model.joblib</text>
    <text x="1045" y="208" text-anchor="middle">metrics.json</text>
    <rect x="1190" y="140" width="160" height="90" rx="8" fill="#fff" stroke="#555"/>
    <text x="1270" y="170" text-anchor="middle" font-weight="700">pytest</text>
    <text x="1270" y="190" text-anchor="middle">13 tests incl.</text>
    <text x="1270" y="208" text-anchor="middle">invalid inputs</text>
  </g>
  <g stroke="#333" stroke-width="1.6" marker-end="url(#a)">
    <line x1="260" y1="185" x2="318" y2="185"/><line x1="530" y1="185" x2="588" y2="185"/>
    <line x1="890" y1="185" x2="948" y2="185"/><line x1="1140" y1="185" x2="1188" y2="185"/>
  </g>

  <!-- Exp 2 image -->
  <rect x="30" y="290" width="860" height="250" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="45" y="315" font-size="15" font-weight="700" fill="#1f5fa8">Experiment 2: Docker image ayushiranjan27/heatguard:1.0 → 1.1 (python:3.13-slim, arm64 + amd64)</text>
  <rect x="55" y="330" width="810" height="190" rx="8" fill="#fff" stroke="#1f5fa8"/>
  <text x="70" y="352" font-size="14" font-weight="700">FastAPI service (uvicorn :8000)</text>
  <g font-size="13">
    <rect x="70" y="365" width="150" height="70" rx="6" fill="#f7f7f7" stroke="#999"/>
    <text x="145" y="392" text-anchor="middle" font-weight="700">Input</text>
    <text x="145" y="412" text-anchor="middle">city, date, 7 Tmax</text>
    <rect x="245" y="365" width="140" height="70" rx="6" fill="#f7f7f7" stroke="#999"/>
    <text x="315" y="392" text-anchor="middle" font-weight="700">Validation</text>
    <text x="315" y="412" text-anchor="middle">404 / 422 errors</text>
    <rect x="410" y="365" width="150" height="70" rx="6" fill="#fff4ec" stroke="#b4441c" stroke-width="2"/>
    <text x="485" y="392" text-anchor="middle" font-weight="700">ML forecast</text>
    <text x="485" y="412" text-anchor="middle">Ridge → Tmax(t+1)</text>
    <rect x="585" y="365" width="130" height="70" rx="6" fill="#fff4ec" stroke="#b4441c" stroke-dasharray="5 3"/>
    <text x="650" y="392" text-anchor="middle" font-weight="700">IMD rules</text>
    <text x="650" y="412" text-anchor="middle">rule-based alert</text>
    <rect x="740" y="365" width="110" height="70" rx="6" fill="#f7f7f7" stroke="#999"/>
    <text x="795" y="392" text-anchor="middle" font-weight="700">Output</text>
    <text x="795" y="412" text-anchor="middle">JSON + advice</text>
    <text x="70" y="465">Endpoints: GET / (dashboard) · /health · /cities · /observed · /model-info · POST /predict</text>
    <text x="70" y="487">Bundled: app code, model.joblib, metrics.json, city_tmax.csv · runs as non-root · HEALTHCHECK on /health</text>
    <text x="70" y="509">Also run per manual: nginx (port 8080), hello-world, ubuntu; nginx pushed as ayushiranjan27/nginx-exp2:1.0</text>
  </g>
  <g stroke="#333" stroke-width="1.6" marker-end="url(#a)">
    <line x1="220" y1="400" x2="243" y2="400"/><line x1="385" y1="400" x2="408" y2="400"/>
    <line x1="560" y1="400" x2="583" y2="400"/><line x1="715" y1="400" x2="738" y2="400"/>
  </g>
  <path d="M1045 230 L1045 270 L600 270 L600 328" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="820" y="264" font-size="12" fill="#333">COPY into image (docker build)</text>

  <!-- Docker Hub -->
  <rect x="950" y="300" width="400" height="100" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="1150" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">Docker Hub (registry)</text>
  <text x="1150" y="358" text-anchor="middle" font-size="13">docker.io/ayushiranjan27/heatguard:1.0, 1.1, latest</text>
  <text x="1150" y="378" text-anchor="middle" font-size="13">multi-arch push with docker buildx</text>
  <line x1="890" y1="350" x2="948" y2="350" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="893" y="342" font-size="12">push</text>

  <!-- Exp 3 -->
  <rect x="950" y="440" width="400" height="290" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="965" y="465" font-size="15" font-weight="700" fill="#1f5fa8">Experiment 3: Kubernetes (kind on Docker Desktop)</text>
  <g font-size="13">
    <rect x="975" y="480" width="350" height="56" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="1150" y="503" text-anchor="middle" font-weight="700">Service heatguard (NodePort 30080)</text>
    <text x="1150" y="523" text-anchor="middle">load-balances across pods</text>
    <rect x="975" y="560" width="350" height="110" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="1150" y="582" text-anchor="middle" font-weight="700">Deployment heatguard (replicas 2 → 3)</text>
    <rect x="990" y="595" width="100" height="40" rx="5" fill="#eef4fb" stroke="#1f5fa8"/><text x="1040" y="620" text-anchor="middle">pod</text>
    <rect x="1100" y="595" width="100" height="40" rx="5" fill="#eef4fb" stroke="#1f5fa8"/><text x="1150" y="620" text-anchor="middle">pod</text>
    <rect x="1210" y="595" width="100" height="40" rx="5" fill="#eef4fb" stroke="#1f5fa8" stroke-dasharray="4 3"/><text x="1260" y="620" text-anchor="middle">pod (scaled)</text>
    <text x="1150" y="657" text-anchor="middle">probes /health · limits 750m CPU, 192Mi (from Exp 7)</text>
    <text x="1150" y="695" text-anchor="middle">self-healing · bad-image rollback · rolling update 1.0→1.1</text>
  </g>
  <line x1="1150" y1="400" x2="1150" y2="558" stroke="#333" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text x="1158" y="548" font-size="12">docker pull</text>
  <line x1="1150" y1="536" x2="1150" y2="558" stroke="#333" stroke-width="1.6"/>

  <!-- users -->
  <rect x="955" y="770" width="390" height="60" rx="10" fill="#fff" stroke="#555"/>
  <text x="1150" y="796" text-anchor="middle" font-size="14" font-weight="700">User: browser dashboard / curl</text>
  <text x="1150" y="816" text-anchor="middle" font-size="13">http://localhost:30080 (K8s) or :8000 (Docker)</text>
  <line x1="1150" y1="768" x2="1150" y2="732" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Exp 7/8 -->
  <rect x="30" y="580" width="860" height="250" rx="10" fill="#eef4fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="45" y="605" font-size="15" font-weight="700" fill="#1f5fa8">Experiments 7 and 8: measurement and cost optimisation (same image, same workload)</text>
  <g font-size="13">
    <rect x="55" y="620" width="220" height="110" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="165" y="645" text-anchor="middle" font-weight="700">loadtest.py</text>
    <text x="165" y="667" text-anchor="middle">15,000 POST /predict</text>
    <text x="165" y="687" text-anchor="middle">real IMD 2024 windows</text>
    <text x="165" y="707" text-anchor="middle">20 clients, fixed seed</text>
    <rect x="320" y="620" width="250" height="110" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="445" y="645" text-anchor="middle" font-weight="700">docker run --cpus --memory</text>
    <text x="445" y="667" text-anchor="middle">Exp 7: 2/2g → 0.75/192m</text>
    <text x="445" y="687" text-anchor="middle">Exp 8: 0.25/0.5g, 0.5/1g, 1/2g</text>
    <text x="445" y="707" text-anchor="middle">3 repeats each</text>
    <rect x="615" y="620" width="250" height="110" rx="6" fill="#fff" stroke="#1f5fa8"/>
    <text x="740" y="645" text-anchor="middle" font-weight="700">docker stats + latency</text>
    <text x="740" y="667" text-anchor="middle">CPU, memory, req/s, p50/p95</text>
    <text x="740" y="687" text-anchor="middle">cost estimate: AWS Fargate ARM</text>
    <text x="740" y="707" text-anchor="middle">Mumbai price list (2026-09-11)</text>
    <text x="55" y="760">Exp 7 result: est. cost/hour −65%, throughput −11%, 0 errors → limits reused in the Kubernetes Deployment.</text>
    <text x="55" y="782">Exp 8 result: cheapest size meeting p95 ≤ 150 ms and 0 errors = 0.25 vCPU / 0.5 GB.</text>
    <text x="55" y="804" fill="#555">Costs are estimates (no cloud account used); instance sizes are emulated with Docker limits on an Apple M2.</text>
  </g>
  <g stroke="#333" stroke-width="1.6" marker-end="url(#a)">
    <line x1="275" y1="675" x2="318" y2="675"/><line x1="570" y1="675" x2="613" y2="675"/>
  </g>
  <path d="M460 540 L460 618" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text x="468" y="572" font-size="12">same image</text>
  <path d="M890 760 L920 760 L920 640 L973 640" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text x="895" y="752" font-size="12">right-sized</text>
  <text x="895" y="766" font-size="12">limits</text>
</svg>
</body></html>
