# Run HeatGuard v2 locally as two containers: backend API + web frontend.
#   docker compose up -d   ->  open http://localhost:8080
name: heatguard
services:
  api:
    image: ayushiranjan27/heatguard:2.0
    build: .
    ports: ["8000:8000"]          # direct API access (Swagger docs at http://localhost:8000/docs)
  web:
    image: ayushiranjan27/heatguard-web:2.0
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
