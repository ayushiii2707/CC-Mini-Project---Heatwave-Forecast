<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeatGuard</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1e1e1e; --muted:#6b6b6b; --line:#e2ddd3;
          --ok:#2e7d32; --hw:#e67e00; --sev:#c62828; --accent:#b4441c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:22px; } header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  main { max-width:980px; margin:0 auto; padding:20px 16px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .card h2 { margin:0 0 12px; font-size:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  select,input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .temps { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .temps input { padding:6px 2px; text-align:center; }
  button { margin-top:12px; padding:9px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button.secondary { background:#555; }
  .big { font-size:40px; font-weight:700; margin:4px 0; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; color:#fff; font-weight:600; }
  .Normal { background:var(--ok); } .Heatwave { background:var(--hw); } .Severe { background:var(--sev); }
  .muted { color:var(--muted); font-size:13px; } .err { color:var(--sev); font-size:14px; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td,th { padding:5px; border-bottom:1px solid var(--line); text-align:left; }
  .full { grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <h1>HeatGuard: Heatwave Forecast &amp; Early Warning</h1>
  <p>Next-day maximum temperature (ML model) + heatwave alert (IMD criteria). Data: IMD Pune 1&deg; gridded Tmax. Educational prototype.</p>
</header>
<main>
  <section class="card">
    <h2>1. Input</h2>
    <label for="city">City (IMD grid cell)</label>
    <select id="city"></select>
    <label for="date">Today's date (newest observation)</label>
    <input id="date" type="date" value="2024-05-27" min="2014-01-07" max="2024-12-31">
    <button class="secondary" id="load">Load IMD observations</button>
    <label>Last 7 days Tmax (&deg;C), oldest &rarr; newest (editable)</label>
    <div class="temps" id="temps"></div>
    <button id="predict">Forecast tomorrow</button>
    <p class="err" id="err"></p>
  </section>
  <section class="card">
    <h2>2. Output</h2>
    <div id="out" class="muted">Run a forecast to see the result.</div>
  </section>
  <section class="card full">
    <h2>Model evaluation (real IMD test year, from /model-info)</h2>
    <div id="info" class="muted">Loading...</div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let actualNext = null;
for (let i = 0; i < 7; i++) { const inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.1'; $('temps').appendChild(inp); }
const temps = () => [...$('temps').children].map(i => parseFloat(i.value));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`HTTP ${r.status}: ` + (typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail)));
  return body;
}

async function loadObs() {
  $('err').textContent = '';
  try {
    const o = await api(`/observed?city=${encodeURIComponent($('city').value)}&date=${$('date').value}`);
    o.recent_tmax.forEach((v, i) => $('temps').children[i].value = v.toFixed(1));
    actualNext = o.actual_next_day_tmax;
  } catch (e) { $('err').textContent = e.message; }
}

async function predict() {
  $('err').textContent = '';
  try {
    const p = await api('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ city: $('city').value, date: $('date').value, recent_tmax: temps() }) });
    const cls = p.alert.split(' ')[0];
    const actual = actualNext == null ? '' :
      `<p class="muted">Actual IMD Tmax on ${p.forecast_date}: <b>${actualNext.toFixed(1)} &deg;C</b> (error ${(p.forecast_tmax - actualNext).toFixed(1)} &deg;C)</p>`;
    $('out').innerHTML = `
      <div class="muted">${p.city} &middot; forecast for ${p.forecast_date}</div>
      <div class="big">${p.forecast_tmax.toFixed(1)} &deg;C</div>
      <span class="badge ${cls}">${p.alert}</span>
      <p>${p.advisory}</p>
      ${actual}
      <table>
        <tr><td>Upper-bound forecast (alert basis)</td><td>${p.upper_forecast_tmax} &deg;C (forecast + ${p.alert_margin_c} &deg;C margin)</td></tr>
        <tr><td>Normal Tmax for date</td><td>${p.normal_tmax} &deg;C</td></tr>
        <tr><td>Departure from normal</td><td>${p.departure_from_normal} &deg;C</td></tr>
        <tr><td>Rule applied</td><td>${p.rule}</td></tr>
        <tr><td>Model</td><td>${p.model} (${p.inference_ms} ms)</td></tr>
        <tr><td>Served by</td><td>${p.pod}</td></tr>
      </table>
      <p class="muted">${p.note}</p>`;
  } catch (e) { $('err').textContent = e.message; }
}

async function init() {
  const cities = await api('/cities');
  cities.forEach(c => { const o = document.createElement('option'); o.value = o.textContent = c.city; $('city').appendChild(o); });
  $('load').onclick = loadObs; $('predict').onclick = predict;
  $('temps').addEventListener('input', () => { actualNext = null; });
  // Optional URL parameters for repeatable demos: ?city=Delhi&date=2024-05-27&auto=1
  const q = new URLSearchParams(location.search);
  if (q.get('city')) $('city').value = q.get('city');
  if (q.get('date')) $('date').value = q.get('date');
  await loadObs();
  if (q.get('auto')) await predict();
  try {
    const m = await api('/model-info');
    const rows = Object.entries(m.models).map(([k, v]) =>
      `<tr><td>${k}${k === m.selected_model ? ' (deployed)' : ''}</td><td>${v.val.MAE}</td><td>${v.test.MAE}</td><td>${v.test.RMSE}</td></tr>`).join('');
    const alertRow = (name, s) => `<tr><td>${name}</td><td>${s.heatwave_recall}</td><td>${s.heatwave_precision}</td><td>${s.heatwave_f2}</td></tr>`;
    $('info').innerHTML = `<table><tr><th>Temperature model</th><th>Val MAE 2023 (&deg;C)</th><th>Test MAE 2024 (&deg;C)</th><th>Test RMSE 2024</th></tr>${rows}</table>
      <p></p><table><tr><th>Heatwave alert on 2024 (${m.severity_on_test_forecast.heatwave_days_actual} actual heatwave city-days)</th><th>Recall</th><th>Precision</th><th>F2</th></tr>
      ${alertRow(`ML forecast + ${m.alert_margin_c} &deg;C margin (deployed)`, m.severity_on_test_forecast)}
      ${alertRow('ML forecast, no margin', m.severity_on_test_forecast_no_margin)}
      ${alertRow('Persistence baseline', m.severity_on_test_persistence)}</table>`;
  } catch (e) { $('info').textContent = e.message; }
}
init();
</script>
</body>
</html>
